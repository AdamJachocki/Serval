name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, build, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore Serval.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format Serval.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Serval.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Serval.slnx --configuration Release --no-build --no-restore --logger "trx;LogFilePrefix=test-results"
